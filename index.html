<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Nome — Portfólio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{gelo:'#F8F8F8',tinta:'#141414',linha:'#E2E2E2',azul:'#0055FF'},fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','ui-monospace','monospace']}}}}
</script>
<style>
html{scroll-behavior:smooth}
body{background:#F8F8F8;color:#141414;-webkit-font-smoothing:antialiased}
::selection{background:#0055FF;color:#fff}
:focus-visible{outline:2px solid #0055FF;outline-offset:2px}
svg{display:block}.vis svg{width:100%;height:100%}
#prog{position:fixed;top:0;left:0;height:2px;width:100%;background:#0055FF;transform:scaleX(0);transform-origin:left;z-index:60}
/* hero: palavras sobem de uma máscara */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em}
.w>span{display:inline-block;transform:translateY(108%);animation:sobe .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*80ms + 100ms)}
@keyframes sobe{to{transform:none}}
.pulso{animation:pulso 1.8s ease-out infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(0,85,255,.5)}100%{box-shadow:0 0 0 10px rgba(0,85,255,0)}}
/* marquee */
.faixa{display:flex;width:max-content;animation:corre 28s linear infinite}
.faixa:hover{animation-play-state:paused}
@keyframes corre{to{transform:translateX(-50%)}}
/* linhas do índice */
.li{opacity:0;animation:entra .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 600ms)}
@keyframes entra{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.row{position:relative;overflow:hidden}
.row::before{content:"";position:absolute;inset:0;background:#0055FF;transform:scaleY(0);transform-origin:bottom;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.row:hover::before,.row:focus-visible::before{transform:scaleY(1)}
.row>*{position:relative;transition:color .25s,transform .4s cubic-bezier(.2,.8,.2,1)}
.row:hover>*,.row:focus-visible>*{color:#fff}
.row:hover .nm,.row:focus-visible .nm{transform:translateX(14px)}
.row:hover .sa{transform:translate(4px,-4px) scale(1.3)}
/* prévia flutuante */
#flutua{position:fixed;left:0;top:0;width:290px;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}
#flutua[data-on="1"]{opacity:1}
#flutua .cx{transform:scale(.85);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#flutua[data-on="1"] .cx{transform:scale(1)}
.wipe{animation:wipe .5s cubic-bezier(.2,.8,.2,1)}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
/* modal */
#modal{opacity:0;pointer-events:none;transition:opacity .25s}
#modal[data-aberto="true"]{opacity:1;pointer-events:auto}
#painel{transform:translateY(40px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#modal[data-aberto="true"] #painel{transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.w>span{transform:none}.li{opacity:1}html{scroll-behavior:auto}}
</style>
</head>
<body class="font-sans">
<div id="prog"></div>

<header class="sticky top-0 z-30 bg-gelo/85 backdrop-blur border-b border-linha">
  <div class="max-w-[1400px] mx-auto px-5 md:px-10 py-4 grid grid-cols-2 md:grid-cols-3 items-center gap-y-2 text-sm">
    <a href="#" class="font-semibold tracking-tight" id="nome"></a>
    <span class="hidden md:block text-center text-tinta/60" id="cargo"></span>
    <nav class="col-span-2 md:col-span-1 md:justify-self-end flex gap-5 font-mono text-xs" id="contatos" aria-label="Contactos"></nav>
  </div>
</header>

<main>
  <!-- HERO -->
  <section class="max-w-[1400px] mx-auto px-5 md:px-10 pt-8 md:pt-12">
    <div class="flex justify-between items-center font-mono text-xs text-tinta/70">
      <span class="flex items-center gap-2"><i class="pulso inline-block w-2 h-2 rounded-full bg-azul"></i>Disponível para novos projetos</span>
      <span id="hora"></span>
    </div>
    <h1 id="hero" class="mt-8 md:mt-12 font-semibold tracking-[-.055em] leading-[.9] text-[clamp(3rem,11.5vw,11rem)]"></h1>
  </section>

  <!-- FAIXA -->
  <div class="mt-10 md:mt-14 border-y border-linha overflow-hidden py-4" aria-hidden="true">
    <div class="faixa" id="faixa"></div>
  </div>

  <!-- ÍNDICE -->
  <section class="max-w-[1400px] mx-auto px-5 md:px-10 pt-14" id="projetos">
    <div class="flex items-baseline justify-between pb-6">
      <h2 class="text-2xl md:text-3xl font-semibold tracking-tight">Projetos</h2>
      <span class="font-mono text-xs text-tinta/50" id="contador"></span>
    </div>
    <ol class="border-t border-linha" id="lista"></ol>
  </section>
</main>

<footer class="border-t border-linha mt-24">
  <div class="max-w-[1400px] mx-auto px-5 md:px-10 py-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 text-sm">
    <p class="text-tinta/70">Tem um projeto em mente? Escreva-me.</p>
    <button id="copiar" class="font-mono text-xs border border-tinta px-4 py-2 hover:bg-azul hover:border-azul hover:text-white transition-colors self-start"><span id="copiarTxt"></span></button>
  </div>
</footer>

<!-- Prévia que segue o rato -->
<div id="flutua" aria-hidden="true"><div class="cx"><div class="aspect-[4/5] border border-linha bg-white overflow-hidden shadow-2xl"><div id="flutuaVis" class="vis w-full h-full"></div></div></div></div>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 z-50" data-aberto="false" role="dialog" aria-modal="true" aria-labelledby="mTitulo">
  <div class="absolute inset-0 bg-tinta/50" data-fechar></div>
  <div id="painel" class="absolute inset-x-0 bottom-0 md:inset-y-6 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-[min(1040px,94vw)] bg-gelo border border-linha overflow-y-auto max-h-[94vh] md:max-h-none">
    <div class="flex items-center justify-between px-6 py-4 border-b border-linha sticky top-0 bg-gelo z-10 font-mono text-xs">
      <span class="text-tinta/60" id="mMeta"></span>
      <span class="flex gap-5"><button data-nav="-1" class="hover:text-azul" aria-label="Anterior">← Anterior</button><button data-nav="1" class="hover:text-azul" aria-label="Seguinte">Seguinte →</button><button data-fechar class="hover:text-azul" aria-label="Fechar">Fechar ✕</button></span>
    </div>
    <div class="grid md:grid-cols-2 gap-8 md:gap-12 p-6 md:p-10">
      <div>
        <h2 id="mTitulo" class="text-4xl md:text-6xl font-semibold tracking-[-.04em] leading-none"></h2>
        <p id="mDesc" class="mt-5 text-tinta/75 leading-relaxed max-w-md"></p>
        <ul id="mDest" class="mt-8 border-t border-linha text-sm"></ul>
        <dl id="mInfo" class="mt-6 grid grid-cols-[6rem_1fr] gap-y-2 text-sm"></dl>
        <div id="mBotoes" class="mt-8 flex flex-wrap gap-3 text-sm"></div>
      </div>
      <div id="mImgs" class="grid gap-4 content-start"></div>
    </div>
  </div>
</div>

<script>
/* ===== 1. SEUS DADOS ===== */
const perfil={
  nome:"Isidoro Muhunga",
  cargo:"Designer & Desenvolvedor",
  headline:"Portfólio |Isidoro Muhunga",
  email:"isidoromuhunga1.com",
  linkedin:"https://linkedin.com/in/seuperfil",
  github:"https://github.com/seuusuario",
  fuso:"Africa/Luanda", cidade:"Luanda"
};

/* ===== 2. PROJETOS (edite / acrescente aqui) =====
   mock: "apoio" | "db" | "viagem" gera um mockup automático.
   Para usar imagem sua, preencha imagem e imagens (têm prioridade). */
const projetos=[
  {titulo:"GASFIG do Moxico",categoria:"Plataforma web",ano:2026,mock:"apoio",
   descricao:"Plataforma confidencial para denunciar violência doméstica, com formulário em etapas e encaminhamento às autoridades.",
   destaques:["Denúncia anónima, disponível 24 horas","Formulário em 4 passos com revisão final","Informação sobre a Lei nº 25/11 e linha 113"],
   papel:"Design e desenvolvimento",tags:["HTML","CSS","JavaScript"],
   imagem:"",imagens:[],linkDemo:"https://isidoromuhunga1.github.io/meus-projectos/Gfm/",linkRepo:"",linkArquivos:""},
  {titulo:"SIGOM-MX",categoria:"Sistema / Backend",ano:2026,mock:"db",
   descricao:"Sistema integrado de gestão da Ordem dos Médicos do Moxico: médicos, hospitais e pagamentos numa base de dados SQLite.",
   destaques:["Modelo relacional: hospitais → médicos → pagamentos","Utilizador administrador com senha em hash bcrypt","Ligação à base encerrada com segurança (SIGINT/SIGTERM)"],
   papel:"Arquitetura e backend",tags:["Node.js","SQLite3","bcrypt"],
   imagem:"",imagens:[],linkDemo:"https://isidoromuhunga1.github.io/meus-projectos/vilts/",linkRepo:"",linkArquivos:"sigom-mx.zip"},
  {titulo:"Jadoo",categoria:"Landing page",ano:2026,mock:"viagem",
   descricao:"Página editorial de viagens com intenção: tipografia grande, grelha limpa e imagens em destaque.",
   destaques:["Títulos em escala editorial com serifa itálica","Cartões de destino com zoom suave ao passar o rato","Menu responsivo e revelação ao rolar"],
   papel:"Design e front-end",tags:["Tailwind CSS","JavaScript","Editorial"],
   imagem:"",imagens:[],linkDemo:"https://isidoromuhunga1.github.io/meus-projectos/Jado/",linkRepo:"",linkArquivos:""}
];

/* ===== 3. MOCKUPS AUTOMÁTICOS ===== */
const F='font-family="Inter,Arial,sans-serif"';
const mocks={
apoio:()=>`<svg viewBox="0 0 400 500"><rect width="400" height="500" fill="#17110F"/><rect width="400" height="28" fill="#C1121F"/><text x="20" y="18" font-size="10" fill="#fff" ${F}>Em perigo imediato? Ligue 113</text><g ${F} font-weight="800" font-size="47" letter-spacing="-2" fill="#fff"><text x="24" y="150">Protegemos.</text><text x="24" y="200" fill="#FF4D5A">Ouvimos.</text><text x="24" y="250">Agimos.</text></g><rect x="24" y="284" width="136" height="38" fill="#C1121F"/><text x="42" y="307" font-size="12" font-weight="700" fill="#fff" ${F}>Fazer Denúncia</text><rect x="170" y="284" width="104" height="38" fill="none" stroke="#fff" stroke-opacity=".5"/><text x="190" y="307" font-size="12" fill="#fff" ${F}>Saber Mais</text><g ${F} fill="#fff" font-size="11"><rect x="24" y="360" width="82" height="70" fill="#fff" fill-opacity=".07"/><rect x="116" y="360" width="82" height="70" fill="#fff" fill-opacity=".07"/><rect x="208" y="360" width="82" height="70" fill="#fff" fill-opacity=".07"/><rect x="300" y="360" width="76" height="70" fill="#fff" fill-opacity=".07"/><text x="34" y="392" font-size="24" font-weight="800" fill="#FF4D5A">1</text><text x="126" y="392" font-size="24" font-weight="800" fill="#FF4D5A">2</text><text x="218" y="392" font-size="24" font-weight="800" fill="#FF4D5A">3</text><text x="310" y="392" font-size="24" font-weight="800" fill="#FF4D5A">4</text><text x="34" y="416" opacity=".7">Formulário</text><text x="126" y="416" opacity=".7">Agressor</text><text x="218" y="416" opacity=".7">Revisão</text><text x="310" y="416" opacity=".7">Apoio</text></g></svg>`,
db:()=>{const t=(x,y,n,c)=>`<g><rect x="${x}" y="${y}" width="150" height="86" fill="#0E1626" stroke="#0055FF"/><rect x="${x}" y="${y}" width="150" height="22" fill="#0055FF"/><text x="${x+10}" y="${y+15}" font-size="11" font-weight="700" fill="#fff" font-family="JetBrains Mono,monospace">${n}</text>${c.map((l,i)=>`<text x="${x+10}" y="${y+40+i*15}" font-size="9.5" fill="#9DB7FF" font-family="JetBrains Mono,monospace">${l}</text>`).join('')}</g>`;
return `<svg viewBox="0 0 400 500"><rect width="400" height="500" fill="#080D18"/><text x="24" y="44" font-size="11" fill="#6C86C9" font-family="JetBrains Mono,monospace">$ npm start</text><text x="24" y="64" font-size="11" fill="#fff" font-family="JetBrains Mono,monospace">=== Inicializando o SIGOM-MX ===</text><path d="M99 120v50h0M99 256v50M99 340v-0" stroke="#0055FF" stroke-width="1.5" fill="none"/><path d="M176 200h48M250 280h0" stroke="#0055FF" stroke-width="1.5" fill="none"/><path d="M99 206v52M99 342v38" stroke="#0055FF" stroke-width="1.5" fill="none"/>${t(24,100,'hospitais',['id','nome','municipio'])}${t(24,226,'medicos',['numero_ordem','nome','hospital_id'])}${t(24,352,'pagamentos',['medico_id','valor','estado'])}${t(226,100,'usuarios',['email','senha (bcrypt)','perfil'])}<text x="226" y="244" font-size="10" fill="#6C86C9" font-family="JetBrains Mono,monospace">data/sigom.sqlite</text><circle cx="232" cy="262" r="4" fill="#27D17F"/><text x="244" y="266" font-size="10" fill="#fff" font-family="JetBrains Mono,monospace">ligado</text></svg>`},
viagem:()=>`<svg viewBox="0 0 400 500"><rect width="400" height="500" fill="#F0E9DC"/><circle cx="290" cy="150" r="58" fill="#E96B4B"/><path d="M0 330C60 290 120 350 200 320S340 290 400 320V500H0Z" fill="#171717"/><path d="M0 380C70 350 140 400 220 372S340 350 400 378V500H0Z" fill="#F9F9F6" opacity=".9"/><g font-weight="700" font-size="40" letter-spacing="-2" fill="#171717" ${F}><text x="24" y="70">O mundo é</text><text x="24" y="114" font-family="Georgia,serif" font-style="italic" font-weight="400">maior do que</text><text x="24" y="158">a sua rotina.</text></g><rect x="24" y="420" width="120" height="34" fill="#E96B4B"/><text x="40" y="441" font-size="11" font-weight="700" fill="#fff" ${F}>Descobrir destinos</text></svg>`
};
const visual=(p,i,n=0)=>{const src=(p.imagens&&p.imagens[n])||(n===0&&p.imagem);
  return src?`<img src="${src}" alt="${p.titulo}" class="w-full h-full object-cover">`:(mocks[p.mock]?mocks[p.mock]():`<svg viewBox="0 0 400 500"><rect width="400" height="500" fill="#EEF2FF"/><text x="30" y="440" font-size="90" font-weight="700" fill="#0055FF" ${F}>${String(i+1).padStart(2,"0")}</text></svg>`)};

/* ===== 4. LÓGICA ===== */
const $=(s,e=document)=>e.querySelector(s),pad=n=>String(n).padStart(2,"0");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.title=perfil.nome+" — Portfólio";
$("#nome").textContent=perfil.nome;$("#cargo").textContent=perfil.cargo;
$("#contatos").innerHTML=[["Email","mailto:"+perfil.email],["LinkedIn",perfil.linkedin],["GitHub",perfil.github]].map(([t,h])=>`<a href="${esc(h)}" target="_blank" rel="noopener" class="hover:text-azul">${t}</a>`).join("");
$("#copiarTxt").textContent="Copiar "+perfil.email;
$("#contador").textContent=pad(projetos.length)+" projetos";

// Hero com palavras a subir
let k=0;$("#hero").innerHTML=perfil.headline.split("|").map(l=>l.split(" ").map(w=>`<span class="w"><span style="--i:${k++}">${esc(w)}</span></span>`).join(" ")).join("<br>");

// Faixa: tags e categorias vindas dos projetos
const itens=[...new Set(projetos.flatMap(p=>[p.categoria,...(p.tags||[])]))];
const bloco=itens.map(t=>`<span class="flex items-center gap-8 pr-8 text-2xl md:text-4xl font-semibold tracking-tight">${esc(t)}<i class="w-2 h-2 rounded-full bg-azul"></i></span>`).join("");
$("#faixa").innerHTML=(bloco.repeat(Math.max(2,Math.ceil(8/itens.length)))).repeat(2);

// Relógio
const relogio=()=>$("#hora").textContent=perfil.cidade+" · "+new Intl.DateTimeFormat("pt-PT",{hour:"2-digit",minute:"2-digit",timeZone:perfil.fuso}).format(new Date());
relogio();setInterval(relogio,20000);

// Progresso de scroll
addEventListener("scroll",()=>{const h=document.documentElement;$("#prog").style.transform=`scaleX(${h.scrollTop/(h.scrollHeight-h.clientHeight||1)})`},{passive:true});

// Lista
$("#lista").innerHTML=projetos.map((p,i)=>`<li class="li border-b border-linha" style="--i:${i}"><button class="row w-full text-left grid grid-cols-[2.2rem_1fr_auto] md:grid-cols-[4.5rem_1fr_12rem_5rem_2.5rem] items-baseline gap-x-3 px-3 py-6 md:py-10" data-i="${i}"><span class="font-mono text-xs text-tinta/50">${pad(i+1)}</span><span class="nm text-3xl md:text-6xl font-semibold tracking-[-.04em]">${esc(p.titulo)}</span><span class="hidden md:block font-mono text-xs text-tinta/60">${esc(p.categoria)}</span><span class="font-mono text-xs text-tinta/60">${esc(p.ano)}</span><span class="sa hidden md:block justify-self-end text-xl">↗</span></button></li>`).join("");

// Prévia flutuante que segue o rato
const fl=$("#flutua"),flv=$("#flutuaVis"),fino=matchMedia("(hover:hover) and (pointer:fine)").matches;
let tx=0,ty=0,x=0,y=0,rot=0;
function mostrar(i){flv.innerHTML=visual(projetos[i],i);flv.classList.remove("wipe");void flv.offsetWidth;flv.classList.add("wipe");fl.dataset.on="1"}
if(fino){
  (function loop(){const dx=tx-x;x+=dx*.14;y+=(ty-y)*.14;rot+=(Math.max(-10,Math.min(10,dx*.22))-rot)*.14;
    const px=x+30+290>innerWidth?x-320:x+30,py=Math.max(10,Math.min(innerHeight-370,y-180));
    fl.style.transform=`translate3d(${px}px,${py}px,0) rotate(${rot}deg)`;requestAnimationFrame(loop)})();
  addEventListener("mousemove",e=>{tx=e.clientX;ty=e.clientY});
}
document.querySelectorAll(".row").forEach(el=>{const i=+el.dataset.i;
  if(fino){el.addEventListener("mouseenter",()=>{x=tx;y=ty;mostrar(i)});el.addEventListener("mouseleave",()=>fl.dataset.on="0")}
  el.addEventListener("click",()=>{fl.dataset.on="0";abrir(i)})});

// Modal
const modal=$("#modal");let atual=0,foco=null;
const btn=(t,h,pri)=>h?`<a href="${esc(h)}" target="_blank" rel="noopener" class="border px-4 py-2 transition-colors ${pri?"bg-azul text-white border-azul hover:bg-tinta hover:border-tinta":"border-tinta hover:bg-tinta hover:text-gelo"}">${t} ↗</a>`:"";
function abrir(i){
  const p=projetos[atual=i];if(modal.dataset.aberto!=="true")foco=document.activeElement;
  $("#mMeta").textContent=`${pad(i+1)} / ${pad(projetos.length)}  ${p.categoria}`;
  $("#mTitulo").textContent=p.titulo;$("#mDesc").textContent=p.descricao||"";
  $("#mDest").innerHTML=(p.destaques||[]).map(d=>`<li class="border-b border-linha py-3 flex gap-3"><i class="mt-2 w-1.5 h-1.5 rounded-full bg-azul shrink-0"></i>${esc(d)}</li>`).join("");
  $("#mInfo").innerHTML=[["Papel",p.papel],["Stack",(p.tags||[]).join(", ")],["Ano",p.ano]].map(([a,b])=>`<dt class="font-mono text-xs text-tinta/50 pt-0.5">${a}</dt><dd>${esc(b)}</dd>`).join("");
  $("#mBotoes").innerHTML=btn("Ver ao vivo",p.linkDemo,1)+btn("Repositório",p.linkRepo)+btn("Arquivos",p.linkArquivos);
  const n=Math.max(1,(p.imagens||[]).length);
  $("#mImgs").innerHTML=Array.from({length:n},(_,j)=>`<div class="vis wipe aspect-[4/5] border border-linha bg-white overflow-hidden">${visual(p,i,j)}</div>`).join("");
  modal.dataset.aberto="true";document.body.style.overflow="hidden";$("#painel").scrollTop=0;$("[data-fechar][aria-label]").focus();
}
function fechar(){modal.dataset.aberto="false";document.body.style.overflow="";foco&&foco.focus()}
modal.addEventListener("click",e=>{if(e.target.closest("[data-fechar]"))return fechar();const n=e.target.closest("[data-nav]");if(n)abrir((atual+ +n.dataset.nav+projetos.length)%projetos.length)});
addEventListener("keydown",e=>{if(modal.dataset.aberto!=="true")return;if(e.key==="Escape")fechar();if(e.key==="ArrowRight")abrir((atual+1)%projetos.length);if(e.key==="ArrowLeft")abrir((atual-1+projetos.length)%projetos.length)});

// Copiar e-mail
$("#copiar").addEventListener("click",async()=>{const t=$("#copiarTxt");try{await navigator.clipboard.writeText(perfil.email);t.textContent="Copiado ✓"}catch{t.textContent=perfil.email}setTimeout(()=>t.textContent="Copiar "+perfil.email,1800)});
</script>
</body>
</html>
